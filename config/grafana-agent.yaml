server:
  log_level: info

metrics:
  wal_directory: /tmp/wal
  global:
    scrape_interval: 15s
    scrape_timeout: 10s
  configs:
    - name: ds-stack
      scrape_configs:
        - job_name: "koyeb_api"
          scheme: https
          static_configs:
            - targets: ["<api>.koyeb.app"]
          metrics_path: /metrics
        - job_name: "koyeb_worker"
          scheme: https
          static_configs:
            - targets: ["<worker>.koyeb.app"]
          metrics_path: /metrics
        - job_name: "upstash_redis"
          scheme: https
          static_configs:
            - targets: ["<upstash-prom-endpoint-host>"]
          metrics_path: /metrics
      remote_write:
        - url: ${GRAFANA_PROM_URL}     # 例: https://prometheus-prod-xx.grafana.net/api/prom/push
          basic_auth:
            username: ${GRAFANA_PROM_USER}  # Instance ID
            password: ${GRAFANA_PROM_APIKEY}
